# MVE 敷地入力テンプレート
#
# これをコピーして、★ の行を自分の敷地の値に書き換えてください。
#   copy examples\敷地入力テンプレート.yaml 自分の敷地.yaml
#   mve 自分の敷地.yaml --cell 2.0
#
# 迷ったら examples/mve_sample.yaml に全項目の説明があります。

site:
  name: 自分の敷地

  # ★ 敷地の形 ---------------------------------------------------------
  # 長方形ならこれが一番かんたん（単位はm）
  rectangle:
    width_m: 30      # ★ 間口（X方向・図面の左右）
    depth_m: 20      # ★ 奥行（Y方向・図面の上下）

  # 長方形でない場合は rectangle を消して、頂点を反時計回りに書く:
  # points:
  #   - [0, 0]
  #   - [25, 0]
  #   - [30, 18]
  #   - [0, 20]

  # CADの敷地図を使う場合は rectangle を消して:
  # dxf:
  #   path: 敷地図.dxf
  #   units_per_meter: 1000   # mmで作図しているなら1000、mなら1

  # ★ 真北 -------------------------------------------------------------
  # 真北が図面の上(+Y)から反時計回りに何度ずれているか。図面の上が真北なら0。
  north_angle_deg: 0

  # ★ 壁面後退距離（全辺の既定値・m）------------------------------------
  # 建物を境界線から下げる距離。0なら緩和を見込みません。
  wall_setback_m: 0

  # ★ 各辺の種別 --------------------------------------------------------
  # 頂点の順番に対応します。長方形なら
  #   1番目 = 下(南)、2番目 = 右(東)、3番目 = 上(北)、4番目 = 左(西)
  edges:
    - kind: road            # ★ 下の辺：前面道路
      road_width_m: 6.0     # ★ 道路の幅員(m)
    - kind: adjacent        # ★ 右の辺：隣地
    - kind: adjacent        # ★ 上の辺：隣地
    - kind: adjacent        # ★ 左の辺：隣地

  # 道路が2本ある場合は、その辺を kind: road にして road_width_m を書けば
  # 令132条（2以上の前面道路）の読み替えが自動で効きます。
  #
  # 隣地の外側が公園・河川・線路の場合はその辺に追記すると緩和が効きます:
  #     - kind: adjacent
  #       relaxation: {kind: water, width_m: 4.0}   # park / water / railway

  # ★ 用途地域など ------------------------------------------------------
  zoning:
    zone_type: 1res         # ★ 下の一覧から選ぶ
    far_ratio: 200          # ★ 容積率(%)：都市計画で定められた値
    coverage_ratio: 60      # ★ 建蔽率(%)
    # absolute_height_limit_m: 10   # 低層住居専用等で絶対高さ制限がある場合

  # zone_type の選択肢:
  #   1low  第一種低層住居専用      2low  第二種低層住居専用
  #   denen 田園住居                1mid  第一種中高層住居専用
  #   2mid  第二種中高層住居専用    1res  第一種住居
  #   2res  第二種住居              quasi_res 準住居
  #   neighbor_commercial 近隣商業  commercial 商業
  #   quasi_industrial 準工業       industrial 工業
  #   industrial_exclusive 工業専用 unspecified 用途地域の指定なし

  floor_height_m: 3.2       # ★ 階高(m)

# ★ 日影規制 ------------------------------------------------------------
# 測定面と規制時間は「条例」で決まります。役所の都市計画課か、自治体の
# ホームページの日影規制の表（別表第四相当）で必ず確認してください。
# 日影規制の対象区域でない場合は、この shadow: セクションごと削除します。
shadow:
  measurement_height_m: 4.0   # ★ 1.5 / 4.0 / 6.5 のいずれか
  line_5m_max_hours: 5.0      # ★ 敷地境界から5m超10m以内の規制時間
  line_10m_max_hours: 3.0     # ★ 10m超の規制時間
  latitude_deg: 35.7          # ★ 敷地の緯度（東京35.7 / 大阪34.7 / 札幌43.1 など）
  hokkaido: false             # ★ 北海道なら true（測定時間が9〜15時になる）

output:
  dxf_path: 結果.dxf
  html_path: 結果_3d.html
