# MVCE 設定ファイルの例
#
# 30m x 20m の敷地。南に6m道路、東西が隣地、北は水路（幅4m）に接する想定。
# 数値はすべて例です。実際の敷地では都市計画図と自治体の条例で確認してください。

site:
  name: サンプル敷地

  # --- 敷地の形（points / rectangle / dxf / json / csv のいずれか）----
  # 頂点は反時計回り。単位はm。+X=図面の右、+Y=図面の上。
  points:
    - [0, 0]
    - [30, 0]
    - [30, 20]
    - [0, 20]

  # 長方形で指定する場合:
  # rectangle:
  #   width_m: 30      # 間口（X方向）
  #   depth_m: 20      # 奥行（Y方向）

  # DXFの敷地図を読み込む場合:
  # dxf:
  #   path: 敷地図.dxf
  #   layer: 敷地          # 省略すると全レイヤから探す
  #   units_per_meter: 1   # mmで作図しているなら 1000
  #   default_road_width_m: 6

  # 外部ツール（測量ソフト等）が出力したJSON/CSVを読み込む場合:
  # json:
  #   path: 敷地図.json     # {"points": [[x,y],...], "edges": [{"kind":...},...]}
  #   default_road_width_m: 6
  # csv:
  #   path: 敷地図.csv       # 1行1頂点。x,y列必須、kind等の列は任意
  #   encoding: shift_jis    # Excelで保存したCSVの場合
  #   default_road_width_m: 6

  # --- 地盤の高さ（傾斜地のみ）-----------------------------------------
  # 各頂点の地盤の高さ（GL, m）。points と同じ数・同じ順。
  # 令2条2項の平均地盤面をここから求めます。省略すると平坦（Z=0）。
  #
  # **注意: 高さの判定はまだ Z=0 から測っています。** 平均地盤面の算定は
  # できますが、斜線・絶対高さ・日影の測定面をそこから測るところまでは
  # 繋いでいません。値を入れると計算結果と一緒に注記が出ます。
  #
  # 接地位置の高低差が3mを超えると、令2条2項が「高低差三メートル以内ごと」に
  # 地盤面を分けろと言う一方でどこで切るかを定めていないので、
  # UNDETERMINED で止まります（既定値では埋めません）。
  # ground_levels: [0.0, 0.0, 1.5, 1.5]

  # --- 日影の高低差緩和（令135条の12第3項第2号・第4項）------------------
  # 詳細は下の shadow: セクションのコメントを参照。
  # shadow_ground:
  #   neighbour_level_m: 3.0      # 隣地等の地盤面（一番低いものを）
  #   designated_level_m:         # 第4項で特定行政庁が定めた位置（あれば）

  # --- 真北 -----------------------------------------------------------
  # 真北が図面の上(+Y)からどれだけ反時計回りにずれているか（度）。
  # 0 なら図面の上が真北。北側斜線と日影計算はこの向きを基準にします。
  north_angle_deg: 0

  # --- 壁面後退距離（全辺の既定値）------------------------------------
  # 建物を境界線から下げる距離。斜線制限の後退緩和と天空率の両方に効きます。
  # 辺ごとに変えたい場合は edges の中で個別に指定してください。
  wall_setback_m: 1.0

  # --- 各辺の境界種別（頂点の順番に対応）------------------------------
  edges:
    - kind: road            # 南側: 前面道路
      road_width_m: 6.0
      wall_setback_m: 1.5   # この辺だけ後退距離を変える例
      # 法52条9項の特定道路。この前面道路が幅員15m以上の道路に接続していて、
      # そこから70m以内の部分に敷地が接しているときに書きます。
      # 令135条の18 の Wa＝(12−Wr)(70−L)/70 を幅員に加えて容積率を出します。
      #   width_m    … 特定道路自体の幅員（15m以上でないと効きません）
      #   distance_m … L。特定道路から、敷地が接する前面道路の部分の
      #                 直近の端までの延長（70m以内でないと効きません）
      # **容積率（法52条2項〜7項）にだけ効きます。** 道路斜線（令132条・
      # 令134条）の幅員は実幅員のままです。
      # specified_road:
      #   width_m: 16.0
      #   distance_m: 30.0
    - kind: adjacent        # 東側: 隣地
    - kind: adjacent        # 北側: 隣地だが水路に接する
      relaxation:
        # park（公園・広場）/ urban_park（都市公園）/ water（水面）/ railway（線路敷）
        #   道路斜線（令134条）… park・urban_park・water が緩和対象
        #   隣地斜線（令135条の3第1項1号）… park・water のみ。都市公園は
        #     対象外で、線路敷は特定行政庁の指定があるときだけ
        #     （site.railway_is_adjacent_relaxation: true）
        #   日影（令135条の12第1項）… water・railway を敷地境界線とみなす
        kind: water
        width_m: 4.0
      # 辺の外側（道路なら路面、隣地なら隣地の地盤面）が敷地の地盤面より
      # 何m高いかの**符号つき**の値。緩和が効く向きは斜線の種類で逆です。
      #   道路（令135条の2）  … 敷地が道路より1m以上高い → -1.0 以下
      #   隣地（令135条の3-1-2）… 敷地が隣地より1m以上低い → +1.0 以上
      # ground_level_diff_m: 0
    - kind: adjacent        # 西側: 隣地

  # --- 用途地域など ---------------------------------------------------
  zoning:
    zone_type: 1res         # 選択肢は mvce/zoning.py の ZONE_LABELS_JA を参照
    far_ratio: 200          # 容積率(%)。比(2.0)で書いてもOK
    coverage_ratio: 60      # 建蔽率(%)
    # absolute_height_limit_m: 10   # 低層住居専用等の絶対高さ制限
    #
    # 以下3つは zone_type: unspecified（用途地域の指定のない区域）でだけ要ります。
    # どちらも条文が特定行政庁・条例の指定に委ねているので、既定値がありません。
    # 指定しないまま計算しようとすると UndeterminedRegulation で止まります。
    #
    # 別表第三 五の項: 道路斜線の勾配（1.25 か 1.5）
    # unspecified_road_slant_slope: 1.5
    #
    # 別表第四 四の項: 日影規制がイかロか
    #   i  … 軒高7m超 または 地階を除く階数3以上 / 測定面 1.5m
    #   ro … 高さ10m超 / 測定面 4m
    # unspecified_shadow_row: ro
    #
    # 法56条1項2号ニ: 隣地斜線の勾配（1.25 か 2.5）。立上りは勾配で決まり、
    # 1.25 なら 20m、2.5 なら 31m。
    # unspecified_adjacent_slant_slope: 2.5
    #
    # --- ここから下は用途地域を問わず使えます ---
    #
    # 法56条1項2号イのただし書: 特定行政庁が指定する区域では、
    # 中高層住専・住居系の隣地斜線が 1.25 → 2.5（立上り 20m → 31m）に
    # なります。中高層住専で容積率の限度が 30/10 以下の場合は対象外です。
    # adjacent_slant_2_5_designated: true

  # --- 敷地が用途地域の2以上にわたる場合（法52条7項・法53条2項）---------
  # 各区域の面積と、その区域の用途地域・容積率・建蔽率。
  # zoning: と同じキーに area_m2（と任意の label）を足したもの。
  # 面積の合計は敷地面積と一致していないとエラーになります（黙って
  # 正規化しません。按分は「敷地面積に対する割合」なので狂うため）。
  #
  # **按分するのは容積率と建蔽率だけです。** 斜線と日影は按分せず、
  # 部分ごとに判定します（隣地・北側は法56条5項、道路は別表第三（い）欄、
  # 日影は令135条の13）。MVCE はまだ部分ごとの判定に対応していないので、
  # 用途地域が2以上あると斜線・日影は UNDETERMINED で止まります。
  # つまり zone_split を書くと容積率・建蔽率の按分はできますが、
  # ボリューム探索はできません。
  #
  # zone_split:
  #   - label: 南側（1住居）
  #     area_m2: 300
  #     zone_type: 1res
  #     far_ratio: 200
  #     coverage_ratio: 60
  #   - label: 北側（近隣商業）
  #     area_m2: 300
  #     zone_type: neighbor_commercial
  #     far_ratio: 400
  #     coverage_ratio: 80

  floor_height_m: 3.2

  # --- 選択規定・行政庁の運用（いずれも既定は保守側の false）------------
  #
  # 令134条2項: 前面道路が2以上あり、そのうちの1つの反対側に公園等がある
  # 場合、令132条1項によらずその道路を基準に全前面道路をみなす。条文が
  # 「よることができる」としている選択規定です。
  # apply_article_134_2: true
  #
  # 隣地斜線で線路敷を緩和対象に含めるか。令135条の3第1項1号は
  # 「公園（都市公園を除く）、広場、水面その他これらに類するもの」で
  # 線路敷を列挙していません。含める運用の行政庁に合わせるときだけ true。
  # railway_is_adjacent_relaxation: true

# --- メッシュ（ボクセルの割り付け）------------------------------------
mesh:
  cell_size_x_m: 3.0        # X方向の幅
  cell_size_y_m: 3.0        # Y方向の幅
  mesh_angle_deg: 0         # 道路に平行に割り付けたい場合などに回転
  coverage_threshold: 0.5   # マスの何割が外郭線に入っていれば採用するか
  # 天空率（法56条7項）で斜線制限に代える場合は true。
  # 斜線制限を外したうえで Ps ≧ Pr を全測定点で確認し、足りなければ
  # 原因になっているマスだけを下げます。壁面後退を取った敷地ほど有利です。
  use_sky_ratio: false
  sky_ratio_interval_m: 4.0   # 測定点の間隔(m)。細かくすると厳しく・遅くなる
  sky_ratio_n_azimuth: 72     # 天空を何方位で刻むか

  # 日影規制への対応方法。
  #   voxel   … マスごとに独立に下げる自由形（既定・最も容積を稼げる）
  #   lean_to … 逆日影・屋根越しパターン（片流れ）。規則正しい量塊になる
  #   ridge   … 逆日影・棟状パターン（切妻）。lean_to を含む一般形
  # 棟の向きは、日影規制を最も厳しくしている太陽方位に自動でアンカーして
  # 探索します（roof_angle_span_deg の範囲）。
  envelope_family: voxel
  # roof_angle_span_deg: 15.0   # 棟の向きを探索する範囲（臨界方位を中心に±この角度）
  # roof_angle_step_deg: 7.5
  # roof_offset_steps: 7        # 棟位置の候補数（ridgeのみ）
  # roof_pitch_candidates_deg: [20.0, 27.0, 35.0, 45.0]       # 日影の厳しい側の勾配候補
  # roof_far_pitch_candidates_deg: [0.0, 20.0, 35.0]          # 反対側（0=制限なし）
  # roof_fixed_low_azimuth_deg: null   # 棟の向きを固定したい場合に指定（探索を省略）

# --- 日影規制 ----------------------------------------------------------
# このセクションを消すと日影のチェックを省略します。
# 測定面と規制時間は条例で決まります。必ず確認してください。
shadow:
  measurement_height_m: 4.0   # 1.5 / 4.0 / 6.5 のいずれか
  line_5m_max_hours: 5.0      # 5m超10m以内の規制時間
  line_10m_max_hours: 3.0     # 10m超の規制時間
  latitude_deg: 35.7
  hokkaido: false             # true なら真太陽時9時〜15時
  time_step_minutes: 10.0
  sample_interval_m: 2.0
  apply_deemed_boundary: true # 令135条の12第3項第1号のみなし境界線を使う
  # --- 高低差緩和（令135条の12第3項第2号・第4項）------------------------
  # 敷地の平均地盤面が隣地（または連接する土地で日影の生ずるもの）の
  # 地盤面より1m以上低い場合、平均地盤面が (高低差−1)/2 だけ高い位置に
  # あるものとみなされ、そのぶん測定面が上がって日影が短くなります。
  #   neighbour_level_m  … 隣地等の地盤面（建築物が無ければ平均地表面）。
  #                        ground_levels と同じ基準の標高。
  #                        **隣地が複数で高さが違うときは一番低いもの**を
  #                        入れてください（緩和が小さくなり安全側）。
  #   designated_level_m … 第4項で特定行政庁が規則で定めた平均地盤面の位置。
  #                        定めがあるときだけ。第2号の計算より優先します。
  # 省略すると緩和を見込みません（保守側）。
  # **入力は site: の直下**（この shadow: の中ではありません）。上の
  # ground_levels のすぐ下にコメントアウトした例があります。
  # isochrone_hours: [2.0, 3.0, 4.0, 5.0]   # 等時間日影線（未指定なら作図しない）
  # isochrone_grid_interval_m: 2.0          # 等時間日影線を求めるグリッドの間隔(m)
  # isochrone_margin_m:                     # 省略すると建物高さから自動計算

output:
  dxf_path: mvce_result.dxf
  html_path: mvce_result.html
  draw_mesh: true
  draw_floor_labels: true
  # DXFは JW-CAD が読める形式（R12・LINEとTEXTのみ・mm）で書き出します。
  # 1mを何単位で書くか。JW-CADはmmなので既定の1000のままで構いません。
  # mで作図している図面に合わせたい場合だけ 1 にしてください。
  dxf_units_per_meter: 1000
