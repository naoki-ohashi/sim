[project]
name = "jwcad-volume"
version = "0.1.0"
description = "JW-CAD external transformation (gaihen) program: legal max building volume via slant-line / sky-ratio (tenkuritsu) / shadow regulation analysis"
requires-python = ">=3.9"
dependencies = [
    "shapely>=2.0",
    "ezdxf>=1.1",
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "openpyxl>=3.1"]
# FreeCADの床面積表をExcel(.xlsx)で出す場合（CSVだけなら不要）
excel = ["openpyxl>=3.1"]

[project.scripts]
jwcad-volume = "jwcad_volume.cli:main"
jwcad-volume-gaihen = "jwcad_volume.gaihen:main"
mve = "mve.cli:main"
freecad-floor-area = "freecad_area.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jwcad_volume*", "mve*", "freecad_area*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
