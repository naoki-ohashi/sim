# 条文だけから決まる既定のプロファイル。
#
# 特定行政庁の運用も選択規定も使わない、保守側の設定です。行政庁の運用に
# 合わせるときは、このファイルをコピーして source を書いてください
# （statutory 以外のプロファイルは source が必須です。原則F）。
name: statutory

# --- 特定行政庁の運用 ---------------------------------------------------
# 令135条の3第1項1号は「公園（都市公園を除く）、広場、水面その他これらに
# 類するもの」で線路敷を列挙していません。
railway_is_adjacent_relaxation: false

# 令135条の12第3項1号は「道路、水面、線路敷その他これらに類するもの」で
# 公園・広場を列挙していません。
park_is_deemed_boundary: false

# --- 選択規定 -----------------------------------------------------------
# 令134条2項は「第百三十二条第一項の規定によらないで…よることができる」。
# 使わないのが令132条1項どおりで保守側です。
apply_article_134_2: false

# --- 条文が決めていない点の解釈 -----------------------------------------
# 令2条2項の「平均の高さ」。条文は取り方を定めていません。
# length_weighted … 接地線に沿った長さ加重平均（実務の通説）
# simple_mean     … 接地位置の単純平均
ground_average_method: length_weighted

# 天空率の区域分割方式（令135条の6第3項・令135条の9第3項）。
# 方式を定めた文書を取得できていないので、null 以外は受け付けません。
sky_region_split_method: null

# --- 精度（法規ではなく計算の細かさ）------------------------------------
sky_reference_layers: 20
sky_azimuth_count: 72
# null なら条文の間隔（令135条の9〜11）。値を入れると細かくできます。
sky_measurement_interval_m: null
